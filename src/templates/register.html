<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrasi Akun - SiKP Informatika</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="bg-light d-flex align-items-center" style="min-height: 100vh; padding: 20px 0;">
    <div class="container" style="max-width: 450px;">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <div class="text-center mb-4">
                    <h4 class="fw-bold mb-1">Daftar Akun SiKP</h4>
                    <p class="text-muted small">Sistem Informasi Kerja Praktek Informatika</p>
                </div>

                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% if messages %}
                        {% for category, message in messages %}
                            <div class="alert alert-{{ category }} p-2 small" role="alert">{{ message }}</div>
                        {% endfor %}
                    {% endif %}
                {% endwith %}

                <form action="/register" method="POST">
                    <div class="mb-3">
                        <label class="form-label small fw-semibold">NPM / NIDN (Username)</label>
                        <input type="text" name="username" class="form-control" placeholder="Contoh: 2024002 / 0417058901" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Nama Lengkap & Gelar</label>
                        <input type="text" name="nama" class="form-control" placeholder="Contoh: Budi Santoso / Dr. Aris, M.T." required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Peran (Role)</label>
                        <select name="role" class="form-select" required>
                            <option value="" selected disabled>-- Pilih Peran --</option>
                            <option value="mahasiswa">Mahasiswa</option>
                            <option value="dosen">Dosen</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Password</label>
                        <input type="password" name="password" class="form-control" placeholder="Buat password" required>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 mt-2">Daftar Sekarang</button>
                </form>

                <div class="text-center mt-3">
                    <span class="small text-muted">Sudah punya akun? </span>
                    <a href="/login" class="small text-decoration-none fw-semibold">Login di sini</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
